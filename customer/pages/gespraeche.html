<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesprächsübersicht - ML Vision Kundenbereich</title>
    <meta name="robots" content="noindex, nofollow">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="../../assets/img/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/pages/gespraeche.css">
</head>
<body>
    <button class="mobile-menu-toggle" onclick="toggleSidebar()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="../../assets/img/logo_white_trans.png" alt="ML Vision">
            </div>

            <ul class="sidebar-menu">
                <!-- Wird dynamisch von CustomerSidebar.js geladen -->
            </ul>

            <div class="sidebar-footer">
                <a href="#" id="logoutBtn">Abmelden</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header">
                <h1>Gesprächsübersicht</h1>
                <p>Alle Telefonate und deren Details im Überblick</p>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-grid">
                    <div class="filter-group">
                        <label>Von Datum</label>
                        <input type="date" id="dateFrom">
                    </div>
                    <div class="filter-group">
                        <label>Bis Datum</label>
                        <input type="date" id="dateTo">
                    </div>
                    <div class="filter-group">
                        <label>Ergebnis</label>
                        <select id="resultFilter">
                            <option value="">Alle</option>
                            <option value="termin">Termin gebucht</option>
                            <option value="info">Info-Anfrage</option>
                            <option value="callback">Rückruf erbeten</option>
                            <option value="hung_up">Aufgelegt</option>
                            <option value="missed">Kein Ergebnis</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Min. Dauer</label>
                        <select id="durationFilter">
                            <option value="0">Alle</option>
                            <option value="30">≥ 0:30 Min</option>
                            <option value="60">≥ 1:00 Min</option>
                            <option value="120">≥ 2:00 Min</option>
                            <option value="300">≥ 5:00 Min</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <button class="filter-button">Filtern</button>
                    </div>
                </div>
            </div>

            <!-- Calls Table -->
            <div class="calls-table-container">
                <div class="table-header">
                    <h2>Gespräche werden geladen …</h2>
                </div>
                <table class="calls-table">
                    <thead>
                        <tr>
                            <th>Datum & Uhrzeit</th>
                            <th>Dauer</th>
                            <th>Ergebnis</th>
                            <th>Anrufer</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" style="text-align:center; padding:48px; color:#9ca3af;">
                                <div style="display:inline-flex; flex-direction:column; align-items:center; gap:12px;">
                                    <svg style="animation:gamma-spin 1s linear infinite; width:28px; height:28px; color:#04A9D4;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle style="opacity:.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path style="opacity:.75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                                    </svg>
                                    <span style="font-size:14px;">Gespräche werden geladen …</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Mobile Calls List (nur auf Mobile sichtbar) -->
            <div class="mobile-calls-list" id="mobileCallsList">
                <!-- Wird dynamisch mit JavaScript gefüllt -->
            </div>

            <!-- Pagination -->
            <div id="pagination" class="pagination-container"></div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal" id="callModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Gesprächsdetails</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Wird dynamisch per JS befüllt -->
            </div>
        </div>
    </div>

    <script type="module" src="../../assets/js/gespraeche.js"></script>
</body>
</html>
