<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechnungen - ML Vision</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="../../assets/img/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        * {box-sizing: border-box;}
        body {margin: 0; padding: 0; font-family: 'Futura Book', Arial, sans-serif; background: #f5f7fa;}
        .dashboard-container {display: flex; min-height: 100vh;}
        .sidebar {width: 280px; background: linear-gradient(180deg, #051d3a 0%, #0a2847 100%); padding: 20px 0; position: fixed; height: 100vh; overflow-y: auto; box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1); z-index: 1000;}
        .sidebar-logo {padding: 0 20px 30px 20px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1);}
        .sidebar-logo img {height: 60px;}
        .sidebar-menu {list-style: none; padding: 20px 0; margin: 0;}
        .sidebar-menu li {margin: 5px 0;}
        .sidebar-menu a {display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: rgba(255, 255, 255, 0.7); text-decoration: none; transition: all 0.3s; position: relative;}
        .sidebar-menu a::before {content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #04A9D4; transform: scaleY(0); transition: transform 0.3s;}
        .sidebar-menu a:hover, .sidebar-menu a.active {color: #fff; background: rgba(4, 169, 212, 0.1);}
        .sidebar-menu a.active::before {transform: scaleY(1);}
        .sidebar-menu svg {width: 20px; height: 20px; fill: currentColor;}
        .sidebar-footer {padding: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 20px;}
        .sidebar-footer a {display: block; padding: 10px; color: #ff4757; text-decoration: none; text-align: center; border: 2px solid #ff4757; border-radius: 8px; transition: all 0.3s;}
        .sidebar-footer a:hover {background: #ff4757; color: #fff;}
        .main-content {flex: 1; margin-left: 280px; padding: 30px;}
        .dashboard-header {margin-bottom: 30px;}
        .dashboard-header h1 {font-size: 32px; color: #1a1a1a; margin: 0 0 10px 0;}
        .dashboard-header p {color: #6b7280; margin: 0;}

        /* Plan Card */
        .plan-card {background: linear-gradient(135deg, #04A9D4 0%, #0390b8 100%); padding: 30px; border-radius: 12px; color: #fff; margin-bottom: 30px; box-shadow: 0 4px 12px rgba(4, 169, 212, 0.3);}
        .plan-card h2 {margin: 0 0 5px 0; font-size: 16px; opacity: 0.9;}
        .plan-name {font-size: 32px; font-weight: bold; margin: 10px 0 20px 0;}
        .plan-details {display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;}
        .plan-detail {background: rgba(255, 255, 255, 0.15); padding: 15px; border-radius: 8px;}
        .plan-detail strong {display: block; font-size: 11px; opacity: 0.9; margin-bottom: 5px; text-transform: uppercase;}
        .plan-detail span {font-size: 18px; font-weight: bold;}

        /* Filters */
        .filters-bar {background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);}
        .filters-grid {display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; align-items: end;}
        .filter-group {display: flex; flex-direction: column;}
        .filter-group label {font-size: 13px; font-weight: bold; color: #6b7280; margin-bottom: 5px;}
        .filter-group input {padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-family: inherit;}
        .status-chips {display: flex; gap: 10px; padding-top: 20px;}
        .chip {padding: 8px 16px; border: 2px solid #e5e7eb; border-radius: 20px; cursor: pointer; transition: all 0.2s; background: #fff; font-size: 14px; font-weight: 500;}
        .chip:hover {border-color: #04A9D4; color: #04A9D4;}
        .chip.active {background: #04A9D4; color: #fff; border-color: #04A9D4;}
        .filter-btn {padding: 10px 20px; background: #04A9D4; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.3s;}
        .filter-btn:hover {background: #0390b8;}

        /* Invoices Table */
        .invoices-card {background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); overflow: hidden;}
        .invoices-table {width: 100%; border-collapse: collapse;}
        .invoices-table th {padding: 15px 20px; text-align: left; font-size: 12px; color: #6b7280; text-transform: uppercase; background: #f9fafb; font-weight: 600;}
        .invoices-table td {padding: 20px; border-top: 1px solid #e5e7eb; font-size: 14px; color: #1a1a1a;}
        .invoices-table tbody tr {transition: all 0.2s;}
        .invoices-table tbody tr:hover {background: #f9fafb;}
        .invoice-status {padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; display: inline-block;}
        .invoice-status.paid {background: #d1fae5; color: #065f46;}
        .invoice-status.open {background: #fef3c7; color: #92400e;}
        .invoice-status.uncollectible {background: #fee2e2; color: #991b1b;}
        .download-btn {display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: #04A9D4; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; text-decoration: none; transition: all 0.3s;}
        .download-btn:hover {background: #0390b8; transform: translateY(-1px);}
        .download-btn svg {width: 16px; height: 16px;}

        /* Pagination */
        .pagination {display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px;}
        .pagination button {padding: 8px 16px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; transition: all 0.2s;}
        .pagination button:hover:not(:disabled) {background: #04A9D4; color: #fff; border-color: #04A9D4;}
        .pagination button:disabled {opacity: 0.5; cursor: not-allowed;}
        .pagination .page-info {color: #6b7280; font-size: 14px;}

        /* Empty State */
        .empty-state {text-align: center; padding: 60px 20px; color: #6b7280;}
        .empty-state svg {width: 80px; height: 80px; margin-bottom: 20px; opacity: 0.3;}
        .empty-state h3 {color: #1a1a1a; margin-bottom: 10px;}
        .loading {text-align: center; padding: 40px; color: #6b7280;}

        @media (max-width: 768px) {
            .sidebar {transform: translateX(-100%); transition: transform 0.3s;}
            .sidebar.active {transform: translateX(0);}
            .main-content {margin-left: 0; padding: 80px 15px 20px 15px;}
            .filters-grid {grid-template-columns: 1fr; gap: 10px;}
            .status-chips {padding-top: 10px; flex-wrap: wrap;}
            .plan-details {grid-template-columns: 1fr;}
            .invoices-table {font-size: 12px;}
            .invoices-table th, .invoices-table td {padding: 12px 10px;}
            .download-btn {padding: 6px 12px; font-size: 12px;}
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo"><img src="../../assets/img/logo_white_trans.png" alt="ML Vision"></div>
            <ul class="sidebar-menu">
                <!-- Wird dynamisch von CustomerSidebar.js geladen -->
            </ul>
            <div class="sidebar-footer"><a href="#" id="logoutBtn">Abmelden</a></div>
        </aside>

        <main class="main-content">
            <div class="dashboard-header">
                <h1>Rechnungen & Verträge</h1>
                <p>Verwalten Sie Ihre Abonnements und Rechnungen</p>
            </div>

            <!-- Plan Card -->
            <div class="plan-card" id="planCard">
                <h2>Ihr aktueller Plan</h2>
                <div class="plan-name" id="planName">Lade...</div>
                <div class="plan-details" id="planDetails">
                    <!-- Wird dynamisch geladen -->
                </div>
            </div>

            <!-- Filters -->
            <div class="filters-bar">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label for="filterFrom">Von Datum</label>
                        <input type="date" id="filterFrom">
                    </div>
                    <div class="filter-group">
                        <label for="filterTo">Bis Datum</label>
                        <input type="date" id="filterTo">
                    </div>
                    <button class="filter-btn" id="applyFilters">Filtern</button>
                </div>
                <div class="status-chips">
                    <div class="chip active" data-status="all">Alle</div>
                    <div class="chip" data-status="paid">Bezahlt</div>
                    <div class="chip" data-status="open">Offen</div>
                    <div class="chip" data-status="uncollectible">Unbezahlbar</div>
                </div>
            </div>

            <!-- Invoices Table -->
            <div class="invoices-card">
                <table class="invoices-table">
                    <thead>
                        <tr>
                            <th>Rechnungs-Nr.</th>
                            <th>Datum</th>
                            <th>Beschreibung</th>
                            <th>Betrag</th>
                            <th>Status</th>
                            <th>Download</th>
                        </tr>
                    </thead>
                    <tbody id="invoicesTableBody">
                        <tr>
                            <td colspan="6" class="loading">Lade Rechnungen...</td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination" id="pagination" style="display: none;">
                    <button id="prevPage">Zurück</button>
                    <span class="page-info" id="pageInfo">Seite 1 von 1</span>
                    <button id="nextPage">Weiter</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth, db, storage } from '../../assets/js/firebase-config.js';
        import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { collection, query, where, orderBy, getDocs, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { ref, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js';
        import { initCustomerSidebar, checkModuleAccess } from '../../assets/js/components/CustomerSidebar.js';

        let currentCustomerId = null;
        let allInvoices = [];
        let filteredInvoices = [];
        let currentPage = 1;
        let currentStatusFilter = 'all';
        const ITEMS_PER_PAGE = 20;

        document.addEventListener('DOMContentLoaded', async () => {
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.href = '../../public/login.html';
                    return;
                }

                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (!userDoc.exists()) {
                        console.error('User document not found in Firestore');
                        alert('Ihr Benutzerprofil wurde nicht gefunden. Bitte kontaktieren Sie den Administrator.');
                        return;
                    }

                    const userData = userDoc.data();
                    if (!userData.customerId) {
                        console.error('customerId not found in user document');
                        alert('Ihre Kundennummer fehlt. Bitte kontaktieren Sie den Administrator.');
                        return;
                    }

                    currentCustomerId = userData.customerId;

                    // Check module access
                    const hasAccess = await checkModuleAccess(currentCustomerId, 'invoices');
                    if (!hasAccess) return;

                    // Initialize sidebar
                    await initCustomerSidebar(currentCustomerId, 'invoices');

                    // Initialize logout
                    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                        e.preventDefault();
                        try {
                            await signOut(auth);
                            window.location.href = '../../public/login.html';
                        } catch (error) {
                            console.error('Logout error:', error);
                            alert('Fehler beim Abmelden.');
                        }
                    });

                    // Load data
                    await loadPlanCard();
                    await loadInvoices();
                    initEventListeners();

                } catch (error) {
                    console.error('Error loading user data:', error);
                    window.location.href = '../../public/login.html';
                }
            });
        });

        function initEventListeners() {
            // Status filter chips
            document.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    currentStatusFilter = chip.dataset.status;
                    currentPage = 1;
                    applyFilters();
                });
            });

            // Apply date filters
            document.getElementById('applyFilters').addEventListener('click', () => {
                currentPage = 1;
                applyFilters();
            });

            // Pagination
            document.getElementById('prevPage').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderInvoices();
                }
            });

            document.getElementById('nextPage').addEventListener('click', () => {
                const totalPages = Math.ceil(filteredInvoices.length / ITEMS_PER_PAGE);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderInvoices();
                }
            });
        }

        async function loadPlanCard() {
            try {
                const customerDoc = await getDoc(doc(db, 'customers', currentCustomerId));
                if (customerDoc.exists()) {
                    const customer = customerDoc.data();

                    document.getElementById('planName').textContent =
                        customer.planName || 'Individuelle Vereinbarung';

                    const detailsHtml = `
                        <div class="plan-detail">
                            <strong>Preis</strong>
                            <span>${customer.planPrice ? `${customer.planPrice}€/Monat` : 'N/A'}</span>
                        </div>
                        <div class="plan-detail">
                            <strong>Status</strong>
                            <span>Aktiv</span>
                        </div>
                        <div class="plan-detail">
                            <strong>Kunde seit</strong>
                            <span>${customer.createdAt ? formatDateShort(customer.createdAt) : 'N/A'}</span>
                        </div>
                    `;

                    document.getElementById('planDetails').innerHTML = detailsHtml;
                }
            } catch (error) {
                console.error('Error loading plan card:', error);
                document.getElementById('planName').textContent = 'Individuelle Vereinbarung';
            }
        }

        async function loadInvoices() {
            try {
                const q = query(
                    collection(db, 'invoices'),
                    where('customerId', '==', currentCustomerId),
                    orderBy('date', 'desc')
                );

                const snapshot = await getDocs(q);
                allInvoices = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                applyFilters();
            } catch (error) {
                console.error('Error loading invoices:', error);
                document.getElementById('invoicesTableBody').innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <h3>Fehler beim Laden</h3>
                            <p>Rechnungen konnten nicht geladen werden.</p>
                        </td>
                    </tr>
                `;
            }
        }

        function applyFilters() {
            const fromDate = document.getElementById('filterFrom').value;
            const toDate = document.getElementById('filterTo').value;

            filteredInvoices = allInvoices.filter(invoice => {
                // Status filter
                if (currentStatusFilter !== 'all' && invoice.status !== currentStatusFilter) {
                    return false;
                }

                // Date filter
                const invoiceDate = parseDate(invoice.date);
                if (fromDate && invoiceDate < new Date(fromDate)) {
                    return false;
                }
                if (toDate && invoiceDate > new Date(toDate)) {
                    return false;
                }

                return true;
            });

            currentPage = 1;
            renderInvoices();
        }

        function renderInvoices() {
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageInvoices = filteredInvoices.slice(start, end);

            if (pageInvoices.length === 0) {
                document.getElementById('invoicesTableBody').innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <h3>Keine Rechnungen gefunden</h3>
                            <p>Passen Sie die Filter an oder warten Sie auf neue Rechnungen.</p>
                        </td>
                    </tr>
                `;
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            const html = pageInvoices.map(invoice => `
                <tr>
                    <td><strong>${escapeHtml(invoice.invoiceNo)}</strong></td>
                    <td>${formatDate(invoice.date)}</td>
                    <td>${escapeHtml(invoice.description || invoice.planName || 'Rechnung')}</td>
                    <td><strong>${formatAmount(invoice.amountGross, invoice.currency)}</strong></td>
                    <td><span class="invoice-status ${invoice.status}">${getStatusText(invoice.status)}</span></td>
                    <td>
                        <button class="download-btn" onclick="window.downloadInvoice('${invoice.id}', '${escapeHtml(invoice.pdfPath)}', '${escapeHtml(invoice.invoiceNo)}')">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            PDF
                        </button>
                    </td>
                </tr>
            `).join('');

            document.getElementById('invoicesTableBody').innerHTML = html;

            // Pagination
            const totalPages = Math.ceil(filteredInvoices.length / ITEMS_PER_PAGE);
            if (totalPages > 1) {
                document.getElementById('pageInfo').textContent = `Seite ${currentPage} von ${totalPages}`;
                document.getElementById('prevPage').disabled = currentPage === 1;
                document.getElementById('nextPage').disabled = currentPage === totalPages;
                document.getElementById('pagination').style.display = 'flex';
            } else {
                document.getElementById('pagination').style.display = 'none';
            }
        }

        window.downloadInvoice = async function(invoiceId, pdfPath, invoiceNo) {
            try {
                // Get download URL from Storage
                const storageRef = ref(storage, pdfPath);
                const url = await getDownloadURL(storageRef);

                // Open in new tab or trigger download
                window.open(url, '_blank');
            } catch (error) {
                console.error('Error downloading invoice:', error);
                if (error.code === 'storage/object-not-found') {
                    alert('PDF-Datei nicht gefunden. Bitte kontaktieren Sie den Support.');
                } else if (error.code === 'storage/unauthorized') {
                    alert('Zugriff verweigert. Sie haben keine Berechtigung für diese Datei.');
                } else {
                    alert('Fehler beim Herunterladen der Rechnung: ' + error.message);
                }
            }
        };

        function getStatusText(status) {
            const statusMap = {
                'paid': 'Bezahlt',
                'open': 'Offen',
                'uncollectible': 'Unbezahlbar'
            };
            return statusMap[status] || status;
        }

        function formatAmount(amountCents, currency = 'EUR') {
            const amount = (amountCents / 100).toFixed(2);
            return `${amount} ${currency}`;
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';

            let date;
            if (timestamp.toDate) {
                date = timestamp.toDate();
            } else if (timestamp.seconds) {
                date = new Date(timestamp.seconds * 1000);
            } else {
                date = new Date(timestamp);
            }

            return date.toLocaleDateString('de-DE', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

        function formatDateShort(timestamp) {
            if (!timestamp) return 'N/A';

            let date;
            if (timestamp.toDate) {
                date = timestamp.toDate();
            } else if (timestamp.seconds) {
                date = new Date(timestamp.seconds * 1000);
            } else {
                date = new Date(timestamp);
            }

            return date.toLocaleDateString('de-DE', {
                month: 'short',
                year: 'numeric'
            });
        }

        function parseDate(timestamp) {
            if (!timestamp) return new Date(0);

            if (timestamp.toDate) {
                return timestamp.toDate();
            } else if (timestamp.seconds) {
                return new Date(timestamp.seconds * 1000);
            } else {
                return new Date(timestamp);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
