<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechnungen - ML Vision</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="../../assets/img/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/pages/rechnungen.css">
</head>
<body>
    <button class="mobile-menu-toggle" onclick="toggleSidebar()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo"><img src="../../assets/img/logo_white_trans.png" alt="ML Vision"></div>
            <ul class="sidebar-menu">
                <!-- Wird dynamisch von CustomerSidebar.js geladen -->
            </ul>
            <div class="sidebar-footer"><a href="#" id="logoutBtn">Abmelden</a></div>
        </aside>

        <main class="main-content">
            <div class="dashboard-header">
                <h1>Rechnungen & Verträge</h1>
                <p>Verwalten Sie Ihre Abonnements und Rechnungen</p>
            </div>

            <!-- Plan Card -->
            <div class="plan-card" id="planCard">
                <h2>Ihr aktueller Plan</h2>
                <div class="plan-name" id="planName">Lade...</div>
                <div class="plan-details" id="planDetails">
                    <!-- Wird dynamisch geladen -->
                </div>
            </div>

            <!-- Filters -->
            <div class="filters-bar">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label for="filterFrom">Von Datum</label>
                        <input type="date" id="filterFrom">
                    </div>
                    <div class="filter-group">
                        <label for="filterTo">Bis Datum</label>
                        <input type="date" id="filterTo">
                    </div>
                    <button class="filter-btn" id="applyFilters">Filtern</button>
                </div>
                <div class="status-chips">
                    <div class="chip active" data-status="all">Alle</div>
                    <div class="chip" data-status="paid">Bezahlt</div>
                    <div class="chip" data-status="open">Offen</div>
                    <div class="chip" data-status="uncollectible">Unbezahlbar</div>
                </div>
            </div>

            <!-- Invoices Table -->
            <div class="invoices-card">
                <table class="invoices-table">
                    <thead>
                        <tr>
                            <th>Rechnungs-Nr.</th>
                            <th>Datum</th>
                            <th>Beschreibung</th>
                            <th>Betrag</th>
                            <th>Status</th>
                            <th>Download</th>
                        </tr>
                    </thead>
                    <tbody id="invoicesTableBody">
                        <tr>
                            <td colspan="6" class="loading">Lade Rechnungen...</td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination" id="pagination" style="display: none;">
                    <button id="prevPage">Zurück</button>
                    <span class="page-info" id="pageInfo">Seite 1 von 1</span>
                    <button id="nextPage">Weiter</button>
                </div>
            </div>

            <!-- Mobile Invoices List (nur auf Mobile sichtbar) -->
            <div class="mobile-invoices-list" id="mobileInvoicesList">
                <!-- Wird dynamisch mit JavaScript gefüllt -->
            </div>

            <!-- Mobile Pagination -->
            <div class="pagination" id="mobilePagination" style="display: none;">
                <button id="mobilePrevPage">Zurück</button>
                <span class="page-info" id="mobilePageInfo">Seite 1 von 1</span>
                <button id="mobileNextPage">Weiter</button>
            </div>
        </main>
    </div>

    <script type="module" src="../../assets/js/rechnungen.js"></script>
</body>
</html>
