<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiken - ML Vision Kundenbereich</title>
    <meta name="robots" content="noindex, nofollow">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="../../assets/img/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/pages/statistiken.css">

</head>
<body>
    <button class="mobile-menu-toggle" onclick="toggleSidebar()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="../../assets/img/logo_white_trans.png" alt="ML Vision">
            </div>

            <ul class="sidebar-menu">
                <!-- Wird dynamisch von CustomerSidebar.js geladen -->
            </ul>

            <div class="sidebar-footer">
                <a href="#" id="logoutBtn">Abmelden</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1>Statistiken</h1>
                    <p>Auswertung Ihrer KI-Telefonate</p>
                </div>
                <!-- Zeitraum-Picker -->
                <div class="period-picker">
                    <button class="period-btn" data-period="week">Diese Woche</button>
                    <button class="period-btn active" data-period="month">Dieser Monat</button>
                    <button class="period-btn" data-period="lastmonth">Letzter Monat</button>
                    <button class="period-btn" data-period="3months">3 Monate</button>
                </div>
            </div>

            <!-- KPI Summary -->
            <div class="stats-kpi-grid" id="kpiGrid">
                <div class="kpi-card loading">
                    <div class="kpi-spinner"></div>
                </div>
                <div class="kpi-card loading">
                    <div class="kpi-spinner"></div>
                </div>
                <div class="kpi-card loading">
                    <div class="kpi-spinner"></div>
                </div>
                <div class="kpi-card loading">
                    <div class="kpi-spinner"></div>
                </div>
            </div>

            <!-- Charts -->
            <div class="chart-grid">
                <!-- Chart 1: Anrufvolumen -->
                <div class="chart-card chart-full">
                    <div class="chart-card-header">
                        <h3>Anrufvolumen (letzte 30 Tage)</h3>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="volumeChart"></canvas>
                    </div>
                </div>

                <!-- Chart 2: Outcome-Donut -->
                <div class="chart-card chart-half">
                    <div class="chart-card-header">
                        <h3>Ergebnis-Verteilung</h3>
                    </div>
                    <div class="chart-wrapper chart-wrapper--donut">
                        <canvas id="outcomeChart"></canvas>
                    </div>
                    <div class="donut-legend" id="donutLegend"></div>
                </div>

                <!-- Chart 3: Monatlicher Trend -->
                <div class="chart-card chart-half">
                    <div class="chart-card-header">
                        <h3>Monatlicher Trend (6 Monate)</h3>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../../assets/js/statistiken.js"></script>
</body>
</html>
