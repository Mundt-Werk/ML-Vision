<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ML Vision</title>
    <meta name="description" content="ML Vision Login">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="../assets/img/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Refactored CSS -->
    <link rel="stylesheet" href="../assets/css/base/variables.css">
    <link rel="stylesheet" href="../assets/css/base/reset.css">
    <link rel="stylesheet" href="../assets/css/base/typography.css">
    <link rel="stylesheet" href="../assets/css/components/buttons.css">
    <link rel="stylesheet" href="../assets/css/components/forms.css">
    <link rel="stylesheet" href="../assets/css/pages/login.css">
</head>
<body>
    <a href="/" class="back-to-home">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        Zurück zur Startseite
    </a>

    <main class="login-main">
        <div class="login-container">
            <div class="login-logo">
                <img src="../assets/img/logo_white_trans.png" alt="ML Vision Logo">
            </div>

            <h1 class="login-title">Willkommen zurück</h1>
            <p class="login-subtitle">Melden Sie sich an, um auf Ihren Bereich zuzugreifen</p>

            <div class="error-message" id="errorMessage"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group-login">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" name="email" placeholder="ihre@email.de" required aria-required="true" autocomplete="username">
                </div>

                <div class="form-group-login">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required aria-required="true" autocomplete="current-password">
                </div>

                <div class="login-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Angemeldet bleiben</label>
                    </div>
                    <a href="/public/password-reset.html" class="forgot-password">Passwort vergessen?</a>
                </div>

                <button type="submit" class="login-button" id="loginButton">Anmelden</button>
            </form>

          
        </div>
    </main>

    <script type="module">
        import { login, redirectByRole, checkAuthState } from '../assets/js/auth.js';
        import { auth } from '../assets/js/firebase-config.js';
        import {
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Check if user is already logged in on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const { user, role } = await checkAuthState();

            if (user) {
                // User is already logged in - redirect to dashboard
                redirectByRole(role);
                return;
            }
        });

        // Login Form Handler
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // Remove error styling on input
        [emailInput, passwordInput].forEach(input => {
            input.addEventListener('input', function() {
                this.classList.remove('error');
                errorMessage.classList.remove('show');
            });
        });

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const remember = document.getElementById('remember').checked;

            // Reset error states
            emailInput.classList.remove('error');
            passwordInput.classList.remove('error');
            errorMessage.classList.remove('show');

            // Basic validation
            if (!email || !password) {
                showError('Bitte füllen Sie alle Felder aus.');
                if (!email) emailInput.classList.add('error');
                if (!password) passwordInput.classList.add('error');
                return;
            }

            // Disable button during login
            loginButton.disabled = true;
            loginButton.textContent = 'Anmeldung läuft...';

            try {
                // Set Firebase Auth Persistence based on "remember me" checkbox
                if (remember) {
                    // Keep user logged in even after browser closes
                    await setPersistence(auth, browserLocalPersistence);
                } else {
                    // Only keep user logged in for this session
                    await setPersistence(auth, browserSessionPersistence);
                }

                // Firebase Authentication
                const result = await login(email, password);

                if (result.success) {
                    // Redirect based on user role
                    redirectByRole(result.role);
                } else {
                    showError(result.error || 'Anmeldung fehlgeschlagen. Bitte überprüfen Sie Ihre Zugangsdaten.');
                    emailInput.classList.add('error');
                    passwordInput.classList.add('error');
                }
            } catch (error) {
                showError(error.message || 'Anmeldung fehlgeschlagen. Bitte überprüfen Sie Ihre Zugangsdaten.');
                emailInput.classList.add('error');
                passwordInput.classList.add('error');
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = 'Anmelden';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }
    </script>
</body>
</html>
