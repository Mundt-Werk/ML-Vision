<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passwort zurücksetzen - ML Vision</title>
    <meta name="description" content="ML Vision Passwort zurücksetzen">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="../assets/img/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Refactored CSS -->
    <link rel="stylesheet" href="../assets/css/base/variables.css">
    <link rel="stylesheet" href="../assets/css/base/reset.css">
    <link rel="stylesheet" href="../assets/css/base/typography.css">
    <link rel="stylesheet" href="../assets/css/components/buttons.css">
    <link rel="stylesheet" href="../assets/css/components/forms.css">
    <link rel="stylesheet" href="../assets/css/pages/login.css">
</head>
<body>
    <a href="/public/login.html" class="back-to-home">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        Zurück zum Login
    </a>

    <main class="login-main">
        <div class="login-container">
            <div class="login-logo">
                <img src="../assets/img/logo_white_trans.png" alt="ML Vision Logo">
            </div>

            <h1 class="login-title">Passwort zurücksetzen</h1>
            <p class="login-subtitle">Geben Sie Ihre E-Mail-Adresse ein, um einen Reset-Link zu erhalten</p>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage" style="display: none;"></div>

            <form class="login-form" id="resetForm">
                <div class="form-group-login">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" name="email" placeholder="ihre@email.de" required aria-required="true" autocomplete="email">
                </div>

                <button type="submit" class="login-button" id="resetButton">Reset-Link senden</button>
            </form>

            <div class="login-footer" style="margin-top: 20px; text-align: center;">
                <p style="color: rgba(225, 232, 237, 0.6); font-size: 14px;">
                    Sie erinnern sich wieder? <a href="/public/login.html" style="color: #04A9D4; text-decoration: none;">Zurück zum Login</a>
                </p>
            </div>
        </div>
    </main>

    <style>
        .success-message {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .success-message svg {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 10px;
        }
    </style>

    <script type="module">
        import { auth } from '../assets/js/firebase-config.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const resetForm = document.getElementById('resetForm');
        const resetButton = document.getElementById('resetButton');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const emailInput = document.getElementById('email');

        // Remove error styling on input
        emailInput.addEventListener('input', function() {
            errorMessage.textContent = '';
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            this.classList.remove('input-error');
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();

            // Validation
            if (!email) {
                showError('Bitte geben Sie Ihre E-Mail-Adresse ein.');
                emailInput.classList.add('input-error');
                return;
            }

            // Email format validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Bitte geben Sie eine gültige E-Mail-Adresse ein.');
                emailInput.classList.add('input-error');
                return;
            }

            // Disable button and show loading
            resetButton.disabled = true;
            resetButton.textContent = 'Wird gesendet...';

            try {
                // Send password reset email
                await sendPasswordResetEmail(auth, email);

                // Success
                showSuccess('✅ Reset-Link wurde gesendet!\n\nBitte überprüfen Sie Ihr E-Mail-Postfach. Falls Sie keine E-Mail erhalten, prüfen Sie auch Ihren Spam-Ordner.');

                // Reset form
                resetForm.reset();

                // Redirect after 5 seconds
                setTimeout(() => {
                    window.location.href = '/public/login.html';
                }, 5000);

            } catch (error) {
                console.error('Password reset error:', error);

                let errorText = 'Es ist ein Fehler aufgetreten. Bitte versuchen Sie es später erneut.';

                switch (error.code) {
                    case 'auth/user-not-found':
                        errorText = 'Es gibt keinen Account mit dieser E-Mail-Adresse.';
                        break;
                    case 'auth/invalid-email':
                        errorText = 'Ungültige E-Mail-Adresse.';
                        break;
                    case 'auth/too-many-requests':
                        errorText = 'Zu viele Anfragen. Bitte warten Sie einen Moment und versuchen Sie es erneut.';
                        break;
                    case 'auth/network-request-failed':
                        errorText = 'Netzwerkfehler. Bitte überprüfen Sie Ihre Internetverbindung.';
                        break;
                }

                showError(errorText);
                emailInput.classList.add('input-error');
            } finally {
                resetButton.disabled = false;
                resetButton.textContent = 'Reset-Link senden';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.innerHTML = message.replace(/\n/g, '<br>');
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }
    </script>
</body>
</html>
