<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kunden → Brevo Sync</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #1a2332; color: #e2e8f0; }
    h1 { color: #04A9D4; }
    .card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; margin: 16px 0; }
    .status { padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: 14px; }
    .status.pending  { background: rgba(255,200,0,0.15); color: #fbbf24; }
    .status.success  { background: rgba(16,185,129,0.15); color: #10b981; }
    .status.error    { background: rgba(239,68,68,0.15); color: #ef4444; }
    button { background: #04A9D4; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 16px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .customer-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .customer-row:last-child { border-bottom: none; }
    label { font-size: 13px; color: rgba(226,232,240,0.6); display: block; margin-bottom: 4px; }
    input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 8px 12px; color: #e2e8f0; width: 100%; box-sizing: border-box; }
    .warning { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3); border-radius: 8px; padding: 12px 16px; color: #fbbf24; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Kunden → Brevo Sync</h1>
  <div class="warning">
    ⚠️ Dieses Script sendet Kundendaten an den n8n-Webhook → Brevo.<br>
    <strong>Keine Mail wird an Kunden gesendet.</strong> Nur Kontakt + Deal in Pipeline.
  </div>

  <div class="card">
    <label>n8n Webhook URL</label>
    <input type="text" id="webhookUrl" value="https://n8n.vision-ml.de/webhook/mlv-kunde-to-brevo" style="margin-bottom:16px">

    <div id="customerList">Lade Kunden aus Firebase...</div>

    <button id="syncBtn" onclick="startSync()" disabled>Alle Kunden zu Brevo synchronisieren</button>
  </div>

  <div id="log"></div>

  <!-- Firebase (kein Analytics — würde CSP verletzen) -->
  <script type="module">
    import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCmh6usqZJeeFgYwaJ6ixOhWVqE3zCaNDs",
      authDomain: "ml-vision-273ee.firebaseapp.com",
      projectId: "ml-vision-273ee",
      storageBucket: "ml-vision-273ee.firebasestorage.app",
      messagingSenderId: "669617565330",
      appId: "1:669617565330:web:5c9dc431f845113f0c804b"
    };
    // Default-App verwenden (teilt Auth-Session mit Admin-Seiten)
    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
    const auth = getAuth(app);
    const db = getFirestore(app);

    let customers = [];

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        document.getElementById('customerList').innerHTML = '<div class="status error">Nicht eingeloggt. Bitte zuerst im Admin einloggen.</div>';
        return;
      }

      try {
        const snap = await getDocs(collection(db, 'sales_leads'));
        customers = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        if (customers.length === 0) {
          document.getElementById('customerList').innerHTML = '<div class="status pending">Keine Kunden in Firebase gefunden.</div>';
          return;
        }

        let html = `<p style="color:rgba(226,232,240,0.6);margin-bottom:12px">${customers.length} Kunden gefunden:</p>`;
        customers.forEach(c => {
          const name = `${c.contactFirstName || ''} ${c.contactLastName || ''}`.trim() || c.name || '—';
          html += `<div class="customer-row">
            <div>
              <strong>${c.companyName || '—'}</strong><br>
              <span style="font-size:13px;color:rgba(226,232,240,0.6)">${name} · ${c.email || '—'} · ${c.phone || '—'}</span>
            </div>
            <span id="status-${c.id}" class="status pending">ausstehend</span>
          </div>`;
        });
        document.getElementById('customerList').innerHTML = html;
        document.getElementById('syncBtn').disabled = false;

      } catch (e) {
        document.getElementById('customerList').innerHTML = `<div class="status error">Fehler beim Laden: ${e.message}</div>`;
      }
    });

    window.startSync = async function() {
      const webhookUrl = document.getElementById('webhookUrl').value.trim();
      if (!webhookUrl) { alert('Webhook URL fehlt!'); return; }

      document.getElementById('syncBtn').disabled = true;
      const log = document.getElementById('log');
      log.innerHTML = '<div class="card"><strong>Sync-Log:</strong><br><br>';

      for (const c of customers) {
        const statusEl = document.getElementById(`status-${c.id}`);
        statusEl.textContent = 'wird gesendet...';
        statusEl.className = 'status pending';

        const name = `${c.contactFirstName || ''} ${c.contactLastName || ''}`.trim() || c.name || '';

        try {
          const res = await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: c.email,
              name: name,
              company: c.companyName,
              phone: c.phone,
              firestoreId: c.id,
              createdAt: c.createdAt || new Date().toISOString()
            })
          });

          if (res.ok) {
            statusEl.textContent = '✓ synchronisiert';
            statusEl.className = 'status success';
            log.innerHTML += `✓ ${c.companyName} (${c.email})<br>`;
          } else {
            const err = await res.text();
            statusEl.textContent = `✗ Fehler ${res.status}`;
            statusEl.className = 'status error';
            log.innerHTML += `✗ ${c.companyName}: HTTP ${res.status} — ${err}<br>`;
          }
        } catch (e) {
          statusEl.textContent = '✗ Netzwerkfehler';
          statusEl.className = 'status error';
          log.innerHTML += `✗ ${c.companyName}: ${e.message}<br>`;
        }

        // Kurze Pause zwischen Requests
        await new Promise(r => setTimeout(r, 500));
      }

      log.innerHTML += '<br><strong>Sync abgeschlossen.</strong></div>';
      document.getElementById('syncBtn').disabled = false;
    };
  </script>
</body>
</html>
